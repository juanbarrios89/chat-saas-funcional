<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat SaaS | Panel de gestión</title>
<style>
:root{--red:#a52b2b;--red2:#842020;--gold:#c18a09;--bg:#f4f5f7;--ink:#222b36;--muted:#6b7280;--line:#e5e7eb;--white:#fff}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink)}button,input,textarea,select{font:inherit}button{cursor:pointer;border:0;border-radius:8px;padding:10px 14px;background:var(--red);color:white;font-weight:700}button:hover{background:var(--red2)}button.secondary{background:#eceff3;color:#303846}button.secondary:hover{background:#dfe3e8}.hidden{display:none!important}
#authView{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(140deg,#761d1d,#b63838 60%,#d7a22a)}.auth-card{width:min(420px,100%);background:white;padding:30px;border-radius:18px;box-shadow:0 20px 60px #0003}.brand{font-weight:800;font-size:25px;color:var(--red);margin-bottom:8px}.muted{color:var(--muted);font-size:14px;line-height:1.5}.field{display:flex;flex-direction:column;gap:6px;margin:14px 0}.field label{font-size:13px;font-weight:700}.field input,.field textarea,.field select{width:100%;padding:11px;border:1px solid #d8dce2;border-radius:8px;background:#fff}.field textarea{resize:vertical;min-height:76px}.auth-actions{display:flex;gap:8px}.auth-actions button{flex:1}.error{color:#b42318;font-size:13px;min-height:18px;margin-top:8px}
header{background:var(--red);color:white;padding:16px 24px;display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:5px solid var(--gold)}header h1{font-size:21px;margin:0}header small{opacity:.85}.top-actions{display:flex;align-items:center;gap:12px}.top-actions button{background:#fff;color:var(--red)}.layout{display:flex;min-height:calc(100vh - 65px)}aside{width:220px;background:#fff;border-right:1px solid var(--line);padding:18px 12px}.nav-btn{display:flex;width:100%;text-align:left;align-items:center;gap:10px;background:transparent;color:#454c57;margin-bottom:7px}.nav-btn:hover,.nav-btn.active{background:#f9eaea;color:var(--red)}main{flex:1;min-width:0;padding:26px;max-width:1400px;margin:0 auto;width:100%}.page-title{margin:0 0 6px;font-size:25px}.page-subtitle{margin:0 0 22px;color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:22px}.stat,.panel,.item{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px}.stat span{font-size:13px;color:var(--muted)}.stat strong{display:block;font-size:28px;margin-top:8px}.columns{display:grid;grid-template-columns:minmax(260px,340px) minmax(0,1fr);gap:18px;align-items:start}.panel h3{margin:0 0 14px}.list{display:flex;flex-direction:column;gap:10px}.item h4{margin:0 0 7px;font-size:16px;overflow-wrap:anywhere}.item p{margin:0 0 12px;color:#5f6672;font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}.item-meta{display:flex;gap:7px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted)}.pill{padding:5px 8px;border-radius:20px;background:#f1f3f5;color:#444;font-weight:700}.pill.red{background:#fbe8e8;color:#9c2525}.pill.gold{background:#fff2cf;color:#805900}.item-actions{margin-top:12px;display:flex;gap:8px;align-items:center}.item-actions select{padding:7px;border:1px solid var(--line);border-radius:7px;background:#fff}.empty{padding:25px;text-align:center;color:var(--muted);border:1px dashed #d2d6dc;border-radius:10px}.chat-layout{display:grid;grid-template-columns:220px minmax(0,1fr);background:white;border:1px solid var(--line);border-radius:12px;overflow:hidden;min-height:480px}.chat-users{background:#fafafa;border-right:1px solid var(--line);padding:12px}.chat-users button{width:100%;text-align:left;margin:3px 0;background:transparent;color:#333}.chat-users button.active,.chat-users button:hover{background:#f9eaea;color:var(--red)}.chat-main{display:flex;flex-direction:column;min-height:480px}.chat-heading{padding:14px 16px;border-bottom:1px solid var(--line);font-weight:700}.messages{flex:1;padding:16px;display:flex;flex-direction:column;gap:10px;max-height:470px;overflow-y:auto;background:#f8f8f7}.bubble{padding:10px 12px;border-radius:10px;background:#fff;border:1px solid var(--line);max-width:75%;align-self:flex-start;overflow-wrap:anywhere}.bubble.mine{background:#fbe8e8;align-self:flex-end}.bubble small{display:block;color:var(--muted);font-size:11px;margin-bottom:4px}.send-row{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}.send-row input{flex:1;min-width:0;border:1px solid var(--line);border-radius:8px;padding:11px}.notice{margin-bottom:14px;padding:10px 12px;border-radius:8px;background:#fff5d8;color:#6e5200;font-size:13px}
@media(max-width:800px){.layout{display:block}aside{width:100%;display:flex;gap:6px;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line)}.nav-btn{width:auto;white-space:nowrap;margin:0}.columns{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}main{padding:16px}.chat-layout{grid-template-columns:130px minmax(0,1fr)}header{padding:14px}header h1{font-size:18px}}@media(max-width:480px){.stats{grid-template-columns:1fr}.top-actions small{display:none}.auth-card{padding:22px}.chat-layout{grid-template-columns:105px minmax(0,1fr)}.bubble{max-width:95%}}
</style>
</head>
<body>
<section id="authView"><div class="auth-card"><div class="brand">◆ Chat SaaS</div><p class="muted">Inicia sesión para gestionar tus tickets, tareas y conversaciones.</p><form id="authForm"><div class="field"><label for="username">Usuario</label><input id="username" minlength="3" maxlength="40" required autocomplete="username" placeholder="Tu usuario"></div><div class="field"><label for="password">Contraseña</label><input id="password" type="password" minlength="6" required autocomplete="current-password" placeholder="Mínimo 6 caracteres"></div><div class="auth-actions"><button type="submit" id="authSubmit">Iniciar sesión</button><button type="button" class="secondary" id="registerBtn">Crear cuenta</button></div></form><div id="authError" class="error" role="status"></div><p class="muted">Cada cuenta ve sus propios tickets y tareas.</p></div></section>
<div id="appView" class="hidden"><header><div><h1>Chat SaaS · Panel de gestión</h1><small>Tickets, tareas y chat en un solo lugar</small></div><div class="top-actions"><small id="welcome"></small><button id="logoutBtn">Cerrar sesión</button></div></header><div class="layout"><aside><button class="nav-btn active" data-page="inicio">▦ Resumen</button><button class="nav-btn" data-page="tickets">▤ Tickets</button><button class="nav-btn" data-page="tareas">✓ Tareas</button><button class="nav-btn" data-page="chat">☏ Chat</button></aside><main id="mainContent"></main></div></div>
<script>
const $=id=>document.getElementById(id);let token=localStorage.getItem('saas_token')||'';let currentUser=localStorage.getItem('saas_user')||'';let page='inicio';let chatPara=null;let usuarios=[];let tickets=[];let tareas=[];let mensajes=[];let registerMode=false;let refreshTimer=null;
async function api(url,options={}){const headers={'Content-Type':'application/json',...(options.headers||{})};if(token)headers.Authorization='Bearer '+token;const res=await fetch(url,{...options,headers});let data={};try{data=await res.json()}catch(_){}if(!res.ok)throw new Error(data.error||'Ocurrió un error.');return data}
function safe(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function showAuth(){if(refreshTimer)clearInterval(refreshTimer);$('authView').classList.remove('hidden');$('appView').classList.add('hidden')}
function showApp(){ $('authView').classList.add('hidden');$('appView').classList.remove('hidden');$('welcome').textContent='Hola, '+currentUser;render();loadAll();if(refreshTimer)clearInterval(refreshTimer);refreshTimer=setInterval(()=>{if(page==='chat')loadMessages().catch(()=>{});},5000)}
$('authForm').addEventListener('submit',async e=>{e.preventDefault();registerMode?await authenticate('register'):await authenticate('login')});$('registerBtn').addEventListener('click',()=>{registerMode=!registerMode;$('authSubmit').textContent=registerMode?'Registrarme':'Iniciar sesión';$('registerBtn').textContent=registerMode?'Volver al login':'Crear cuenta';$('authError').textContent='';$('password').autocomplete=registerMode?'new-password':'current-password'});
async function authenticate(mode){$('authError').textContent='';try{const data=await api('/api/auth/'+mode,{method:'POST',body:JSON.stringify({username:$('username').value.trim(),password:$('password').value})});token=data.token;currentUser=data.username;localStorage.setItem('saas_token',token);localStorage.setItem('saas_user',currentUser);showApp()}catch(e){$('authError').textContent=e.message}}
$('logoutBtn').addEventListener('click',()=>{token='';currentUser='';localStorage.removeItem('saas_token');localStorage.removeItem('saas_user');showAuth()});document.querySelectorAll('.nav-btn').forEach(b=>b.addEventListener('click',()=>{page=b.dataset.page;document.querySelectorAll('.nav-btn').forEach(x=>x.classList.toggle('active',x===b));render();if(page==='chat')loadChatData()}));
async function loadAll(){try{[tickets,tareas]=await Promise.all([api('/api/tickets'),api('/api/tareas')]);render()}catch(e){if(e.message.includes('Sesión')){token='';localStorage.removeItem('saas_token');showAuth()}else toast(e.message)}}
function toast(message){const old=$('toast');if(old)old.remove();const el=document.createElement('div');el.id='toast';el.className='notice';el.textContent=message;$('mainContent').prepend(el);setTimeout(()=>el.remove(),4000)}
function render(){const main=$('mainContent');if(page==='inicio'){main.innerHTML=`<h2 class="page-title">Resumen</h2><p class="page-subtitle">Este es el estado actual de tu espacio de trabajo.</p><div class="stats"><div class="stat"><span>Tickets registrados</span><strong>${tickets.length}</strong></div><div class="stat"><span>Tareas pendientes</span><strong>${tareas.filter(t=>t.estado!=='Completada').length}</strong></div><div class="stat"><span>Tareas completadas</span><strong>${tareas.filter(t=>t.estado==='Completada').length}</strong></div></div><div class="panel"><h3>Bienvenido a Chat SaaS</h3><p class="muted">Usa el menú para crear tickets, organizar tus tareas o conversar desde el chat. Los datos se guardan en la base de datos.</p><button onclick="go('tickets')">Crear un ticket</button> <button class="secondary" onclick="go('tareas')">Añadir una tarea</button></div>`}else if(page==='tickets'){renderTickets(main)}else if(page==='tareas'){renderTareas(main)}else{renderChat(main);loadChatData()}}
function go(p){page=p;document.querySelectorAll('.nav-btn').forEach(x=>x.classList.toggle('active',x.dataset.page===p));render()}
function renderTickets(main){main.innerHTML=`<h2 class="page-title">Tickets</h2><p class="page-subtitle">Registra solicitudes y actualiza su estado.</p><div class="columns"><form id="ticketForm" class="panel"><h3>Nuevo ticket</h3><div class="field"><label>Título</label><input name="titulo" maxlength="120" required placeholder="Ej. Revisar problema de conexión"></div><div class="field"><label>Descripción</label><textarea name="descripcion" maxlength="2000" placeholder="Detalles del ticket"></textarea></div><div class="field"><label>Prioridad</label><select name="prioridad"><option>Baja</option><option selected>Media</option><option>Alta</option></select></div><button type="submit">Guardar ticket</button></form><section><div id="ticketList" class="list">${tickets.length? tickets.map(ticketCard).join(''):'<div class="empty">Todavía no tienes tickets.</div>'}</div></section></div>`;$('ticketForm').addEventListener('submit',async e=>{e.preventDefault();const f=new FormData(e.currentTarget);try{await api('/api/tickets',{method:'POST',body:JSON.stringify(Object.fromEntries(f))});await loadAll();toast('Ticket creado correctamente.')}catch(err){toast(err.message)}});main.querySelectorAll('[data-ticket-state]').forEach(s=>s.addEventListener('change',async()=>{try{await api('/api/tickets/'+s.dataset.id,{method:'PATCH',body:JSON.stringify({estado:s.value})});await loadAll()}catch(e){toast(e.message)}}))}
function ticketCard(t){return `<article class="item"><h4>${safe(t.titulo)}</h4><p>${safe(t.descripcion||'Sin descripción')}</p><div class="item-meta"><span class="pill ${t.prioridad==='Alta'?'red':t.prioridad==='Media'?'gold':''}">${safe(t.prioridad)}</span><span>Creado: ${new Date(t.createdAt).toLocaleDateString('es-CO')}</span></div><div class="item-actions"><label class="muted" for="ts-${safe(t._id)}">Estado</label><select id="ts-${safe(t._id)}" data-ticket-state data-id="${safe(t._id)}">${['Abierto','En progreso','Cerrado'].map(s=>`<option ${t.estado===s?'selected':''}>${s}</option>`).join('')}</select></div></article>`}
function renderTareas(main){main.innerHTML=`<h2 class="page-title">Tareas</h2><p class="page-subtitle">Organiza el trabajo y marca el avance de cada actividad.</p><div class="columns"><form id="taskForm" class="panel"><h3>Nueva tarea</h3><div class="field"><label>Título</label><input name="titulo" maxlength="120" required placeholder="Ej. Preparar entrega del proyecto"></div><div class="field"><label>Descripción</label><textarea name="descripcion" maxlength="2000" placeholder="Qué necesitas hacer"></textarea></div><div class="field"><label>Fecha límite (opcional)</label><input name="fechaLimite" type="date"></div><button type="submit">Guardar tarea</button></form><section><div class="list">${tareas.length?tareas.map(taskCard).join(''):'<div class="empty">Todavía no tienes tareas.</div>'}</div></section></div>`;$('taskForm').addEventListener('submit',async e=>{e.preventDefault();const f=new FormData(e.currentTarget);const obj=Object.fromEntries(f);if(!obj.fechaLimite) obj.fechaLimite=null;try{await api('/api/tareas',{method:'POST',body:JSON.stringify(obj)});await loadAll();toast('Tarea creada correctamente.')}catch(err){toast(err.message)}});main.querySelectorAll('[data-task-state]').forEach(s=>s.addEventListener('change',async()=>{try{await api('/api/tareas/'+s.dataset.id,{method:'PATCH',body:JSON.stringify({estado:s.value})});await loadAll()}catch(e){toast(e.message)}}))}
function taskCard(t){return `<article class="item"><h4>${safe(t.titulo)}</h4><p>${safe(t.descripcion||'Sin descripción')}</p><div class="item-meta"><span class="pill ${t.estado==='Completada'?'':'gold'}">${safe(t.estado)}</span><span>Fecha límite: ${t.fechaLimite?new Date(t.fechaLimite).toLocaleDateString('es-CO',{timeZone:'UTC'}):'Sin fecha'}</span></div><div class="item-actions"><label class="muted" for="ta-${safe(t._id)}">Actualizar</label><select id="ta-${safe(t._id)}" data-task-state data-id="${safe(t._id)}">${['Pendiente','En progreso','Completada'].map(s=>`<option ${t.estado===s?'selected':''}>${s}</option>`).join('')}</select></div></article>`}
function renderChat(main){main.innerHTML=`<h2 class="page-title">Chat</h2><p class="page-subtitle">Conservamos el chat del sistema base.</p><div class="chat-layout"><div class="chat-users" id="chatUsers"><button class="active" data-chat="">🌍 Chat global</button><p class="muted">Cargando usuarios...</p></div><div class="chat-main"><div class="chat-heading" id="chatHeading">Chat global</div><div class="messages" id="messages"><div class="empty">Cargando mensajes...</div></div><form id="sendForm" class="send-row"><input id="messageInput" maxlength="2000" required placeholder="Escribe un mensaje..."><button>Enviar</button></form></div></div>`;$('sendForm').addEventListener('submit',async e=>{e.preventDefault();const input=$('messageInput');const mensaje=input.value.trim();if(!mensaje)return;try{await api('/api/mensajes',{method:'POST',body:JSON.stringify({mensaje,para:chatPara})});input.value='';await loadMessages()}catch(err){toast(err.message)}})}
async function loadChatData(){try{usuarios=await api('/api/usuarios');const box=$('chatUsers');if(!box)return;box.innerHTML=`<button data-chat="" class="${chatPara===null?'active':''}">🌍 Chat global</button>`+usuarios.filter(u=>u.username!==currentUser).map(u=>`<button data-chat="${safe(u.username)}" class="${chatPara===u.username?'active':''}">👤 ${safe(u.username)}</button>`).join('');box.querySelectorAll('[data-chat]').forEach(b=>b.addEventListener('click',()=>{chatPara=b.dataset.chat||null;renderChatUsers();loadMessages().catch(e=>toast(e.message))}));await loadMessages()}catch(e){toast(e.message)}}
function renderChatUsers(){const box=$('chatUsers');if(!box)return;box.querySelectorAll('[data-chat]').forEach(b=>b.classList.toggle('active',(b.dataset.chat||null)===chatPara));$('chatHeading').textContent=chatPara?'Chat con '+chatPara:'Chat global'}
async function loadMessages(){if(page!=='chat')return;const data=await api('/api/mensajes'+(chatPara?'?para='+encodeURIComponent(chatPara):''));mensajes=data;const box=$('messages');if(!box)return;const visibles=data.filter(m=>chatPara?((m.de===currentUser&&m.para===chatPara)||(m.de===chatPara&&m.para===currentUser)):!m.para);box.innerHTML=visibles.length?visibles.map(m=>`<div class="bubble ${m.de===currentUser?'mine':''}"><small>${safe(m.de)} · ${new Date(m.createdAt).toLocaleTimeString('es-CO',{hour:'2-digit',minute:'2-digit'})}</small>${safe(m.mensaje)}</div>`).join(''):'<div class="empty">No hay mensajes todavía. ¡Escribe el primero!</div>';box.scrollTop=box.scrollHeight}
if(token&&currentUser)showApp();else showAuth();
</script>
</body></html>
